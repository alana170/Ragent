<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ragent replay</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101821;color:#e6edf3}body{max-width:1050px;margin:2rem auto;padding:0 1rem}h1{margin-bottom:.2rem}p{color:#b4c2cf}.bar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:1rem 0}button,select{background:#263746;color:white;border:1px solid #627b8c;border-radius:6px;padding:.55rem .8rem;cursor:pointer}canvas{width:100%;height:auto;background:#192a30;border:1px solid #4a6265;border-radius:8px}input{flex:1;min-width:160px}#status{font-weight:600}#log{height:8em;overflow:auto;color:#bdcbd2;font-size:.9rem} .attack{color:#ff8b80}.defend{color:#7fc8ff}
</style></head><body><h1>Ragent match replay</h1><p>Top-down simulation · <span class="attack">attackers</span> vs <span class="defend">defenders</span> · squares are cover</p>
<div class="bar"><button id="toggle">Pause</button><label>Speed <select id="speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select></label><input id="seek" type="range" min="0" value="0" aria-label="Replay position"><span id="status"></span></div>
<canvas id="map" width="1000" height="600" aria-label="Top-down match replay"></canvas><p id="summary"></p><div id="log" aria-live="polite"></div>
<script>
const data = /* REPLAY_DATA */;
const match=data.match, cfg=data.config, frames=match.events.filter(e=>e.type==='frame'), events=match.events.filter(e=>e.type!=='frame');
const canvas=document.getElementById('map'), ctx=canvas.getContext('2d'), seek=document.getElementById('seek'), status=document.getElementById('status'), log=document.getElementById('log');
seek.max=Math.max(0,frames.length-1); let index=0,playing=true,last=0,acc=0;
const X=x=>x/cfg.map.width*canvas.width, Y=y=>y/cfg.map.height*canvas.height;
function draw(){const f=frames[index];if(!f)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#20363a';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.strokeStyle='#304b4c';ctx.lineWidth=1;for(let x=0;x<=cfg.map.width;x+=10){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),canvas.height);ctx.stroke()}for(let y=0;y<=cfg.map.height;y+=10){ctx.beginPath();ctx.moveTo(0,Y(y));ctx.lineTo(canvas.width,Y(y));ctx.stroke()}
cfg.map.sites.forEach((s,i)=>{ctx.strokeStyle='#e5c86d';ctx.lineWidth=3;ctx.strokeRect(X(s[0])-27,Y(s[1])-27,54,54);ctx.fillStyle='#e5c86d';ctx.font='bold 20px system-ui';ctx.fillText(i===0?'A':'B',X(s[0])-7,Y(s[1])+7)});
ctx.fillStyle='#526c6c';cfg.map.cover.forEach(r=>ctx.fillRect(X(r[0]),Y(r[1]),X(r[2]-r[0]),Y(r[3]-r[1])));
f.smokes.forEach(s=>{ctx.beginPath();ctx.ellipse(X(s.pos[0]),Y(s.pos[1]),X(s.radius),Y(s.radius),0,0,Math.PI*2);ctx.fillStyle='#aebfc6aa';ctx.fill()});
f.players.forEach(p=>{let x=X(p.pos[0]),y=Y(p.pos[1]);ctx.globalAlpha=p.health>0?1:.3;ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fillStyle=p.team==='attackers'?'#ff7669':'#65bbff';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText(p.id.toUpperCase(),x-10,y+4);ctx.fillStyle='#101820';ctx.fillRect(x-16,y-22,32,4);ctx.fillStyle='#9bea9b';ctx.fillRect(x-16,y-22,32*Math.max(0,p.health)/cfg.health,4);ctx.globalAlpha=1});
status.textContent=`Round ${f.round} · ${f.time.toFixed(1)}s`;seek.value=index;let recent=events.filter(e=>e.round===f.round&&e.time<=f.time).slice(-6);log.innerHTML=recent.map(e=>`${e.time.toFixed(1)}s — ${e.type.replace('_',' ')}${e.player?' · '+e.player:''}${e.target?' → '+e.target:''}${e.damage?' · '+e.damage+' damage':''}`).join('<br>');}
function animate(t){if(last&&playing){acc+=(t-last)*Number(document.getElementById('speed').value)/1000;while(acc>=cfg.tick_seconds&&index<frames.length-1){index++;acc-=cfg.tick_seconds}if(index===frames.length-1){playing=false;document.getElementById('toggle').textContent='Replay'}}last=t;draw();requestAnimationFrame(animate)}
document.getElementById('toggle').onclick=()=>{if(index===frames.length-1){index=0;acc=0}playing=!playing;document.getElementById('toggle').textContent=playing?'Pause':'Play'};seek.oninput=()=>{index=Number(seek.value);acc=0;draw()};document.getElementById('summary').textContent=`Scenario: ${match.scenario_id} · Seed: ${match.seed} · Match winner: ${match.winner}`;requestAnimationFrame(animate);
</script></body></html>
